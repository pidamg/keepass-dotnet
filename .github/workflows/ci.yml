name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore
        run: dotnet restore Pidamg.KeePass.Kdbx.slnx
      - name: Validate public API
        run: >
          dotnet format src/Pidamg.KeePass.Kdbx/Pidamg.KeePass.Kdbx.csproj
          analyzers
          --verify-no-changes
          --no-restore
          --diagnostics RS0016 RS0017
      - name: Build
        run: dotnet build Pidamg.KeePass.Kdbx.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Pidamg.KeePass.Kdbx.slnx --configuration Release --no-build

  pack:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Resolve version
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          NUMERIC_VERSION="${PACKAGE_VERSION%%-*}"
          MAJOR="${NUMERIC_VERSION%%.*}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "ASSEMBLY_VERSION=$MAJOR.0.0.0" >> "$GITHUB_ENV"
          echo "FILE_VERSION=$NUMERIC_VERSION.0" >> "$GITHUB_ENV"
      - name: Pack
        run: >
          dotnet pack src/Pidamg.KeePass.Kdbx/Pidamg.KeePass.Kdbx.csproj
          --configuration Release
          -p:Version="$PACKAGE_VERSION"
          -p:AssemblyVersion="$ASSEMBLY_VERSION"
          -p:FileVersion="$FILE_VERSION"
          --output nupkgs/
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkgs/

  test-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nupkgs/
      - name: Test packed public API
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          dotnet restore tests/Pidamg.KeePass.Kdbx.IntegrationTests/Pidamg.KeePass.Kdbx.IntegrationTests.csproj \
            -p:TestPackageVersion="$PACKAGE_VERSION" \
            --source "$PWD/nupkgs" \
            --source "https://api.nuget.org/v3/index.json"
          dotnet test tests/Pidamg.KeePass.Kdbx.IntegrationTests/Pidamg.KeePass.Kdbx.IntegrationTests.csproj \
            --configuration Release \
            --no-restore \
            -p:TestPackageVersion="$PACKAGE_VERSION"

  publish-github-packages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack, test-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nupkgs/
      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://nuget.pkg.github.com/pidamg/index.json"
          --api-key "$GITHUB_TOKEN"
          --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-nuget:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [pack, test-package]
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nupkgs/
      - name: Authenticate to NuGet.org
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
